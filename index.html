<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>最強蝸牛 遊戲紀錄</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>🐌 最強蝸牛・遊戲紀錄</h1>

    <section class="card">
      <h2>綜合實力</h2>
      <p class="hero" id="hero">—</p>
      <p class="muted" id="hero-sub">載入中…</p>
    </section>

    <section class="card" id="chart-card" hidden>
      <h2>綜合實力成長 <span class="sub">每日最高值</span></h2>
      <div id="chart" class="chart"></div>
    </section>

    <section class="card" id="table-card" hidden>
      <details>
        <summary>查看全部紀錄 <span id="count" class="sub"></span></summary>
        <table>
          <thead><tr><th scope="col">綜合實力</th><th scope="col">日期</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </details>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
